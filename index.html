    background: #0f5132; color: #fff; border: none; padding: 0 22px;

  /* --- Живая лог-консоль ------------------------------------------------- */

  }

  .con .ts { color: #5f7d6d; margin-right: 6px; }
  .con .warn { color: #f0b45e; }
  .con .err2 { color: #ff8a80; }
  .con .ok  { color: #8ef0b4; }
  .con .step { color: #cfe9d8; }
  .jtoggle {
    color: #7cc4ff; cursor: pointer; text-decoration: underline dotted;
    margin-left: 22px;
  }
  .jbox {
    display: none; margin: 4px 0 6px 22px; padding: 10px; background: #071009;
    border: 1px solid #1e3a2a; border-radius: 8px; color: #b7f5cf;
    font-size: 11.5px; line-height: 1.45; overflow: auto; max-height: 220px;
    white-space: pre; word-break: normal;
  }
  .jbox.show { display: block; }

  .spinner {
    display: none; margin: 20px auto; width: 32px; height: 32px;
    border: 4px solid #e0e0e0; border-top-color: #0f5132; border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  .spinner.show { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { text-align: center; font-size: 11.5px; color: #8a9691; padding: 0 0 18px; }
</style>
</head>
<body>
  <div class="card">
    <header>
      <h1>⚽ AI Футбольный Ассистент</h1>
      <p>Реальные данные · TheSportsDB &nbsp;|&nbsp; AI · OpenRouter</p>
    </header>
    <div class="body">
      <div class="examples">
        <button class="chip">Покажи таблицу АПЛ</button>
        <button class="chip">Ближайшие матчи Барселоны</button>
        <button class="chip">Последние результаты Реал Мадрид</button>
        <button class="chip">Расскажи о клубе Ливерпуль</button>
      </div>
      <div class="input-row">
        <input id="q" type="text" placeholder="Задай вопрос про футбол..." autocomplete="off">
        <button class="send" id="send">Спросить</button>
      </div>
      <div class="spinner" id="spinner"></div>
      <div class="answer" id="answer"></div>
      <div class="con" id="con"></div>
    </div>
    <footer>Homework 1 · AI Data Assistant</footer>
  </div>

<script>
/* ==========================================================================
   ⚽ AI ФУТБОЛЬНЫЙ АССИСТЕНТ
   --------------------------------------------------------------------------
   Схема работы (видна в живом логе ниже):
     Вопрос → [1] ИИ (OpenRouter) выбирает нужный запрос к API
            → [2] TheSportsDB отдаёт реальные футбольные данные (JSON)
            → [3] ИИ анализирует данные и пишет ответ
   ========================================================================== */

// --- Ключи и настройки ----------------------------------------------------
// AI-слой: OpenRouter (ключ постоянный, не истекает; работает из браузера).
// ⚠️ Ключ виден в исходнике страницы — для учебной работы это нормально.
// Свой ключ можно создать бесплатно: https://openrouter.ai/settings/keys
const BUILTIN_AI_KEY = "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";
const SPORTSDB_KEY   = "3";  // бесплатный тестовый ключ TheSportsDB

// Свой ключ OpenRouter можно ввести прямо на странице — он сохранится в браузере
// (localStorage) и будет использоваться вместо встроенного.
function getAIKey() {
  return (localStorage.getItem("openrouter_key") || "").trim() || BUILTIN_AI_KEY;
}

// Бесплатные модели OpenRouter для перебора: если одна перегружена или упёрлась
// в лимит (HTTP 429) — ассистент автоматически пробует следующую.
const AI_MODELS = [
  "google/gemma-4-31b-it:free",
  "openai/gpt-oss-20b:free",
  "inclusionai/ling-3.0-flash:free",
  "nvidia/nemotron-3-super-120b-a12b:free",
];

const AI_URL   = "https://openrouter.ai/api/v1/chat/completions";
const SDB_BASE = `https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}`;

// Лиги TheSportsDB (id + человекочитаемое имя)
const LEAGUES = {
  "4328": "English Premier League (Англия)",
  "4335": "Spanish La Liga (Испания)",
  "4331": "German Bundesliga (Германия)",
  "4332": "Italian Serie A (Италия)",
  "4334": "French Ligue 1 (Франция)",
  "4337": "Dutch Eredivisie (Нидерланды)",
};

// ==========================================================================
// Живая лог-консоль
// ==========================================================================
const conEl = document.getElementById("con");
let t0 = 0;
function ts() {
  const ms = Date.now() - t0;
  const s = Math.floor(ms / 1000), mm = String(Math.floor(s / 60)).padStart(2, "0");
  const ss = String(s % 60).padStart(2, "0"), mmm = String(ms % 1000).padStart(3, "0");
  return `[${mm}:${ss}.${mmm}]`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
function con(html, cls = "step") {
  const d = document.createElement("div");
  d.className = "ln";
  d.innerHTML = `<span class="ts">${ts()}</span><span class="${cls}">${html}</span>`;
  conEl.appendChild(d);
  conEl.scrollTop = conEl.scrollHeight;
  return d;
}
function conJson(obj) {
  const str = JSON.stringify(obj, null, 2);
  const kb = (new TextEncoder().encode(str).length / 1024).toFixed(1);
  const d = document.createElement("div");
  d.className = "ln";
  const shown = str.length > 8000 ? str.slice(0, 8000) + "\n… (обрезано)" : str;
  d.innerHTML = `<span class="jtoggle">показать JSON (${kb} КБ)</span>` +
                `<pre class="jbox">${escapeHtml(shown)}</pre>`;
  const box = d.querySelector(".jbox"), tog = d.querySelector(".jtoggle");
  tog.addEventListener("click", () => {
    box.classList.toggle("show");
    tog.textContent = box.classList.contains("show")
      ? `скрыть JSON (${kb} КБ)` : `показать JSON (${kb} КБ)`;
  });
  conEl.appendChild(d);
  conEl.scrollTop = conEl.scrollHeight;
}

// ==========================================================================
// Вызов ИИ (OpenRouter) с перебором моделей при ошибке лимита/перегрузки
// ==========================================================================
async function callGemini(prompt, jsonMode, stepLabel) {
  let lastErr = "";
  for (const model of AI_MODELS) {
    const body = {
      model,
      messages: [{ role: "user", content: prompt }],
      temperature: 0.3,
      max_tokens: 800,
    };
    let res, data;
    try {
      res = await fetch(AI_URL, {
        method: "POST",
        headers: { "Authorization": "Bearer " + getAIKey(), "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      data = await res.json().catch(() => ({}));
    } catch (e) {
      lastErr = `${model}: сеть недоступна`;
      con(`⚠ ${escapeHtml(lastErr)} — пробую другую модель…`, "warn");
      continue;
    }

    const text = (data.choices && data.choices[0] && data.choices[0].message
                  && data.choices[0].message.content || "").trim();
    if (res.ok && text) {
      return { text, model, request: body, response: data };
    }

    const msg = (data.error && data.error.message) || ("HTTP " + res.status);
    lastErr = `${model}: HTTP ${res.status} ${msg}`;
    con(`⚠ ${escapeHtml(lastErr)} — пробую другую модель…`, "warn");
  }
  throw new Error(lastErr || "ИИ недоступен");
}

// --- Вызов TheSportsDB ----------------------------------------------------
async function sdb(path) {
  const url = `${SDB_BASE}${path}`;
  con(`↳ GET ${escapeHtml(url)}`);
  const res = await fetch(url);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error("TheSportsDB вернул ошибку " + res.status);
  return data;
}

// ==========================================================================
// ШАГ 1. Gemini понимает вопрос и выбирает нужный запрос (роутер → JSON)
// ==========================================================================
async function routeQuestion(question) {
  const prompt = `Ты — маршрутизатор запросов к футбольному API TheSportsDB.
По вопросу пользователя верни СТРОГО JSON.

Возможные intent:
- "table"     — турнирная таблица лиги
- "next"      — ближайшие (будущие) матчи команды
- "last"      — последние (сыгранные) матчи команды
- "team_info" — общая информация о клубе
- "unknown"   — вопрос не про футбол

Лиги (league_id): ${JSON.stringify(LEAGUES)}

Правила:
- Для "table": укажи league_id (по умолчанию "4328").
- Для "next"/"last"/"team_info": укажи "team" — АНГЛИЙСКОЕ официальное название клуба
  (например: "Барселона"→"Barcelona", "Реал Мадрид"→"Real Madrid", "Ливерпуль"→"Liverpool").
- Верни ТОЛЬКО JSON, без пояснений.

Формат: {"intent":"...", "league_id":"4328", "team":"Barcelona"}

Вопрос: "${question}"`;

  const r = await callGemini(prompt, true, "роутер");
  let plan;
  try { plan = JSON.parse(r.text); }
  catch { plan = JSON.parse(r.text.slice(r.text.indexOf("{"), r.text.lastIndexOf("}") + 1)); }
  return { plan, model: r.model, response: r.response };
}

// ==========================================================================
// ЗАПАСНОЙ РЕЖИМ (без ИИ): определяем запрос по ключевым словам
// Нужен, если Gemini недоступен (истёк ключ, кончилась квота и т.п.)
// ==========================================================================
const TEAMS_RU_EN = {
  "барселон": "Barcelona", "реал": "Real Madrid", "атлетико": "Atletico Madrid",
  "ливерпул": "Liverpool", "манчестер юнайтед": "Manchester United",
  "манчестер сити": "Manchester City", "арсенал": "Arsenal", "челси": "Chelsea",
  "тоттенхэм": "Tottenham", "бавария": "Bayern Munich", "боруссия": "Borussia Dortmund",
  "ювентус": "Juventus", "милан": "AC Milan", "интер": "Inter", "наполи": "Napoli",
  "псж": "Paris SG", "аякс": "Ajax", "порту": "FC Porto", "бенфика": "Benfica",
};
const LEAGUES_RU = {
  "4328": ["апл", "премьер", "англ"],
  "4335": ["ла лига", "лалига", "испан"],
  "4331": ["бундеслиг", "герман"],
  "4332": ["серия", "итал"],
  "4334": ["лига 1", "франц"],
  "4337": ["эредивиз", "нидерланд", "голланд"],
};

function fallbackRoute(question) {
  const q = question.toLowerCase();

  // ищем команду по словарю
  let team = "";
  for (const [ru, en] of Object.entries(TEAMS_RU_EN)) {
    if (q.includes(ru)) { team = en; break; }
  }

  // информация о клубе
  if (/расскажи|о клубе|информац|инфо/.test(q) && team)
    return { intent: "team_info", team };
  // ближайшие матчи
  if (/ближайш|следующ|расписан|когда играет|предстоящ/.test(q) && team)
    return { intent: "next", team };
  // последние результаты
  if (/последн|результат|счёт|счет|как сыграл/.test(q) && team)
    return { intent: "last", team };
  // если команда есть, но непонятно что — показываем последние матчи
  if (team) return { intent: "last", team };

  // турнирная таблица
  if (/табл|турнир|мест|очк|лидер/.test(q)) {
    let league = "4328";
    for (const [id, words] of Object.entries(LEAGUES_RU))
      if (words.some(w => q.includes(w))) { league = id; break; }
    return { intent: "table", league_id: league };
  }

  return { intent: "table", league_id: "4328" };
}

// Локальное форматирование данных, если ИИ недоступен
function formatLocally(intent, label, data) {
  if (intent === "table") {
    const rows = data.map(t =>
      `${t.intRank}. ${t.strTeam} — ${t.intPoints} очков ` +
      `(и: ${t.intPlayed}, в: ${t.intWin}, н: ${t.intDraw}, п: ${t.intLoss})`);
    return `📊 ${label}\n\n${rows.join("\n")}`;
  }
  if (intent === "team_info") {
    return `ℹ️ ${data.name}\n\n` +
      `🏆 Лига: ${data.league || "—"}\n🌍 Страна: ${data.country || "—"}\n` +
      `📅 Основан: ${data.founded || "—"}\n🏟 Стадион: ${data.stadium || "—"}` +
      (data.capacity ? ` (вместимость ${data.capacity})` : "") +
      (data.website ? `\n🔗 Сайт: ${data.website}` : "");
  }
  // матчи
  if (!data.length) return `⚽ ${label}\n\nМатчей не найдено.`;
  const rows = data.map(e => {
    const score = (e.homeScore !== null && e.homeScore !== undefined && e.homeScore !== "")
      ? `  ${e.homeScore}:${e.awayScore}` : "";
    return `📅 ${e.date || "—"}${e.time ? " " + e.time.slice(0, 5) : ""} — ${e.match}${score}` +
           (e.league ? `\n   🏆 ${e.league}` : "");
  });
  return `⚽ ${label}\n\n${rows.join("\n")}`;
}

function describePlan(plan) {
  const t = plan.team || "";
  switch (plan.intent) {
    case "table":     return `Запрос таблицы лиги ${LEAGUES[plan.league_id || "4328"] || plan.league_id}`;
    case "next":      return `Ближайшие матчи команды: ${t}`;
    case "last":      return `Последние матчи команды: ${t}`;
    case "team_info": return `Информация о клубе: ${t}`;
    default:          return "Вопрос не относится к футболу";
  }
}

// ==========================================================================
// ШАГ 2. По плану запрашиваем реальные данные из TheSportsDB
// ==========================================================================
async function fetchData(plan) {
  const intent = plan.intent;

  if (intent === "table") {
    const leagueId = plan.league_id || "4328";
    const leagueName = LEAGUES[leagueId] || leagueId;
    for (const season of ["2025-2026", "2024-2025", "2023-2024"]) {
      const data = await sdb(`/lookuptable.php?l=${leagueId}&s=${season}`);
      if (data.table && data.table.length) {
        return { label: `Турнирная таблица (топ-${data.table.length}) · ${leagueName} · сезон ${season}`,
                 data: data.table.slice(0, 20) };
      }
    }
    throw new Error("Таблица для этой лиги не найдена.");
  }

  if (intent === "next" || intent === "last" || intent === "team_info") {
    const team = plan.team || "";
    if (!team) throw new Error("Не удалось определить команду в вопросе.");
    const found = await sdb(`/searchteams.php?t=${encodeURIComponent(team)}`);
    if (!found.teams || !found.teams.length) throw new Error(`Команда «${team}» не найдена.`);
    const tm = found.teams[0];

    if (intent === "team_info") {
      return { label: `Информация о клубе · ${tm.strTeam}`, data: {
        name: tm.strTeam, country: tm.strCountry, league: tm.strLeague,
        founded: tm.intFormedYear, stadium: tm.strStadium,
        capacity: tm.intStadiumCapacity, location: tm.strLocation,
        website: tm.strWebsite, description: (tm.strDescriptionEN || "").slice(0, 1500),
      }};
    }

    const ep = intent === "next" ? "eventsnext" : "eventslast";
    const ev = await sdb(`/${ep}.php?id=${tm.idTeam}`);
    const events = (ev.events || ev.results || []).map(e => ({
      match: e.strEvent, date: e.dateEvent, time: e.strTime,
      league: e.strLeague, homeScore: e.intHomeScore, awayScore: e.intAwayScore,
    }));
    const word = intent === "next" ? "Ближайшие матчи" : "Последние результаты";
    return { label: `${word} · ${tm.strTeam}`, data: events };
  }

  throw new Error("UNKNOWN");
}

// ==========================================================================
// ШАГ 3. Gemini анализирует данные и пишет ответ
// ==========================================================================
async function summarize(question, label, data) {
  const prompt = `Ты — дружелюбный футбольный ассистент.
Пользователь спросил: "${question}"

Ниже реальные данные из TheSportsDB (JSON). Раздел: ${label}.
Ответь на русском кратко, понятно и по делу, с эмодзи где уместно.
Приводи конкретные названия, счёт, очки и даты ИЗ данных. Ничего не выдумывай.
Если это таблица — покажи топ команд с очками (столбец intPoints).
Если матчи — соперники, дата и счёт (если он есть).

ДАННЫЕ:
${JSON.stringify(data).slice(0, 12000)}`;
  return callGemini(prompt, false, "суммаризация");
}

// ==========================================================================
// Связка UI
// ==========================================================================
const q = document.getElementById("q");
const send = document.getElementById("send");
const answerEl = document.getElementById("answer");
const spinner = document.getElementById("spinner");

document.querySelectorAll(".chip").forEach(c =>
  c.addEventListener("click", () => { q.value = c.textContent; ask(); }));
q.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
send.addEventListener("click", ask);

async function ask() {
  const question = q.value.trim();
  if (!question) return;

  t0 = Date.now();
  answerEl.className = "answer";
  answerEl.textContent = "";
  conEl.innerHTML = "";
  conEl.className = "con show";
  spinner.className = "spinner show";
  send.disabled = true;

  try {
    con("Система готова. Источник данных: TheSportsDB, ИИ: OpenRouter (бесплатные модели).", "ok");
    con(`🎙 Вопрос принят: «${escapeHtml(question)}»`);

    // ШАГ 1 — понимание вопроса (с запасным режимом без ИИ)
    con("🧠 Шаг 1 — ИИ решает, какой запрос к API нужен…");
    let plan, aiAvailable = true;
    try {
      const r = await routeQuestion(question);
      plan = r.plan;
      con(`🧠 ИИ (${r.model}) выбрал: ${plan.intent} — ${escapeHtml(describePlan(plan))}`, "ok");
      conJson(r.response);
    } catch (e) {
      aiAvailable = false;
      con(`⚠ ИИ недоступен — определяю запрос без него (по ключевым словам)…`, "warn");
      plan = fallbackRoute(question);
      con(`🔎 Определено без ИИ: ${plan.intent} — ${escapeHtml(describePlan(plan))}`, "warn");
    }

    if (plan.intent === "unknown") {
      con("ℹ Вопрос не про футбол — данные не запрашиваю.", "warn");
      answerEl.textContent = "Я отвечаю только на вопросы про футбол ⚽ " +
        "(таблицы лиг, матчи команд, инфо о клубах). Например: «Покажи таблицу АПЛ» " +
        "или «Ближайшие матчи Барселоны».";
      answerEl.className = "answer show";
      return;
    }

    // ШАГ 2
    con(`📡 Шаг 2 — запрос реальных данных из футбольного API…`);
    const { label, data } = await fetchData(plan);
    const n = Array.isArray(data) ? data.length : 1;
    con(`📦 Данные получены: «${escapeHtml(label)}» (записей: ${n}, сжаты для ИИ).`, "ok");
    conJson(data);

    // ШАГ 3 — ответ (через ИИ, а если он недоступен — форматируем сами)
    let answerText;
    if (aiAvailable) {
      con("🧠 Шаг 3 — ИИ анализирует данные и пишет ответ…");
      try {
        const ans = await summarize(question, label, data);
        con(`✅ Готово — ответ сформирован моделью ${ans.model}.`, "ok");
        answerText = ans.text;
      } catch (e) {
        con("⚠ ИИ не ответил — показываю данные напрямую, без ИИ.", "warn");
        answerText = formatLocally(plan.intent, label, data);
      }
    } else {
      con("📋 Шаг 3 — ИИ недоступен, показываю полученные данные напрямую.", "warn");
      answerText = formatLocally(plan.intent, label, data);
    }
    if (!aiAvailable) {
      answerText += "\n\n⚠️ ИИ сейчас недоступен (возможно, закончился дневной лимит OpenRouter). " +
        "Данные выше — реальные, получены из футбольного API. Попробуй позже.";
    }
    answerEl.textContent = answerText;
    answerEl.className = "answer show";

  } catch (e) {
    con(`⛔ Ошибка: ${escapeHtml(e.message)}`, "err2");
    answerEl.innerHTML = "⚠️ " + escapeHtml(e.message);
    answerEl.className = "answer err show";
  } finally {
    spinner.className = "spinner";
    send.disabled = false;
  }
}
</script>
